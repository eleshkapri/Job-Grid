<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Grid Assist</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <div class="logo-icon">J</div>
        <h1>Job Grid Assist</h1>
      </div>
      <div id="status-indicator" class="status-indicator" title="Status"></div>
    </div>

  <!-- Login View -->
  <div id="login-view" class="view hidden">
    <p class="subtitle">Login to connect your profile</p>
    <form id="login-form">
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="btn primary-btn">Login</button>
    </form>
    <p id="login-error" class="error-msg hidden"></p>
  </div>

  <!-- Authenticated View -->
  <div id="auth-view" class="view hidden">
    <div class="profile-card">
      <h2 id="profile-name">User Name</h2>
      <p id="profile-email">email@example.com</p>
      <p id="profile-stats">0 skills</p>
    </div>
    
    <div class="actions">
      <button id="btn-fill" class="btn primary-btn">Fill Current Page</button>
      <button id="btn-dashboard" class="btn secondary-btn">Open Dashboard</button>
      <button id="btn-logout" class="btn text-btn">Logout</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
